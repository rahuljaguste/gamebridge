# SPDX-License-Identifier: AGPL-3.0-only

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Release quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-verify

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: JavaScript syntax and motion math
        run: |
          node --check crates/server/src/static/app.js
          node --check crates/server/src/static/motion-math.js
          node --test tools/test_motion_math.js

      - name: License inventory
        run: python3 tools/gen_licenses.py --check

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Ensure build target is installed
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install NASM
        if: runner.os == 'Windows'
        run: choco install nasm -y --no-progress

      - name: Build (musl static)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          # musl-gcc wrappers and static-PIE have produced _start segfaults;
          # build a conventional static (non-PIE) executable instead.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: "-C relocation-model=static"
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build
        if: matrix.target != 'x86_64-unknown-linux-musl'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)
          test "$tag" = "$version" || { echo "tag v$tag does not match Cargo.toml $version"; exit 1; }

      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/gamebridge"
          if [ "${{ runner.os }}" = "Windows" ]; then bin="$bin.exe"; fi
          "$bin" --version

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)
          name="gamebridge-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/gamebridge" "dist/${name}/"
          cp README.md COPYING THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -rf "dist/${name}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $name = "gamebridge-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/gamebridge.exe" "dist/$name/"
          Copy-Item README.md,COPYING,THIRD_PARTY_NOTICES.md,THIRD_PARTY_LICENSES.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse -Force "dist/$name"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamebridge-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Source archive
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)
          mkdir -p dist
          git archive --format=tar.gz \
            --prefix="gamebridge-${version}/" \
            -o "dist/gamebridge-${version}-source.tar.gz" HEAD
          test -s "dist/gamebridge-${version}-source.tar.gz"
          tar -tzf "dist/gamebridge-${version}-source.tar.gz" >/dev/null

      - name: Checksums
        run: |
          cd dist
          sha256sum $(ls -1 | grep -v '^SHA256SUMS$') > SHA256SUMS

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            Prebuilt GameBridge binaries for this release.

            | Platform | Asset |
            | --- | --- |
            | macOS Apple Silicon | `gamebridge-*-aarch64-apple-darwin.tar.gz` |
            | macOS Intel | `gamebridge-*-x86_64-apple-darwin.tar.gz` |
            | Linux x86_64 (static musl) | `gamebridge-*-x86_64-unknown-linux-musl.tar.gz` |
            | Windows x86_64 | `gamebridge-*-x86_64-pc-windows-msvc.zip` |
            | Source (AGPL-3.0-only) | `gamebridge-*-source.tar.gz` |

            Verify your download against `SHA256SUMS`.

            The source archive contains the exact Corresponding Source for the
            binaries in this release.

            **Platform notes**

            - macOS binaries are unsigned and not notarized. If Gatekeeper
              blocks the binary, run `xattr -d com.apple.quarantine gamebridge`
              after extracting it, or right-click it and choose **Open**.
            - Windows SmartScreen may warn about an unsigned binary. Choose
              **More info → Run anyway** only if you trust the source.
            - The Linux binary is statically linked and should run on any
              x86_64 distribution.

            GameBridge is an unofficial client and is not affiliated with or
            endorsed by Sony Interactive Entertainment. Use it at your own
            risk; see the Terms and risk section in `README.md`.
