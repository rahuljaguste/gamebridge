name: Bug report
description: Report a reproducible GameBridge problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include console registration keys, `hosts.json`, auth tokens,
        PSN account IDs, PINs, or unredacted logs. Security vulnerabilities must
        go through the private advisory flow, not this issue.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start GameBridge with ...
        2. Open ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: GameBridge version
      description: Output of `gamebridge --version`, or the release tag.
      placeholder: "0.8.3"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Host platform
      options:
        - macOS Apple Silicon
        - macOS Intel
        - Linux x86_64
        - Windows x86_64
        - Other / built from source
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome / Chromium
        - Edge
        - Safari
        - Firefox
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact tokens, registration keys, account IDs, PINs, and personal information.
      render: shell
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I removed secrets and personal data from this report.
          required: true
        - label: This is not a security vulnerability; I will use the private advisory flow for those.
          required: true
