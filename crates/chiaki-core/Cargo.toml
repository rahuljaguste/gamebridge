[package]
name = "chiaki-core"
description = "Unofficial Rust port of the Chiaki protocol core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "chiaki_core"
path = "src/lib.rs"

[dependencies]
aes = "0.8.4"
aes-gcm = "0.10.3"
cfb-mode = "0.8.2"
cipher = "0.5.2"
hmac = "0.12.1"
sha2 = "0.10.9"
secp256k1 = { version = "0.29.1", features = ["rand"] }
rand = "0.8.5"
hex = "0.4.3"
bytes = "1.10"
thiserror = "2.0"
tracing = "0.1"
tokio = { version = "1.47", features = ["net", "time", "sync", "io-util", "macros", "rt"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
socket2 = { version = "0.5.9", features = ["all"] }
if-addrs = "0.15"
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.6"

[dev-dependencies]
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "net", "time"] }
tempfile = "3"
